<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión Escolar - Alumno</title>
  <link rel="stylesheet" href="../css/portal.css" />
</head>
<body>
  <main class="container">
    <header class="topbar">
      <h1>Alumno</h1>
      <button type="button" class="secundario" id="btn-menu">Menú</button>
    </header>

    <div id="mensaje" class="mensaje oculto" role="alert" aria-live="polite"></div>

    <!-- 1. Datos personales, carrera, semestre y materias -->
    <section class="card">
      <h2>1. Datos personales, carrera, semestre y materias</h2>
      <div class="tabla-wrapper">
        <table>
          <thead>
            <tr>
              <th>Nombre completo</th>
              <th>Matrícula</th>
              <th>Carrera</th>
              <th>Semestre</th>
              <th>Materias</th>
            </tr>
          </thead>
          <tbody id="tabla-datos-alumno">
            <tr>
              <td colspan="5" class="centrado">Sin información disponible.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- 2. Calificaciones -->
    <section class="card">
      <h2>2. Calificaciones</h2>
      <div class="tabla-wrapper">
        <table>
          <thead>
            <tr>
              <th>Materia</th>
              <th>Calificación</th>
            </tr>
          </thead>
          <tbody id="tabla-calificaciones">
            <tr>
              <td colspan="2" class="centrado">Sin calificaciones registradas.</td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <td>Promedio</td>
              <td id="promedio-calificaciones">—</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </section>

    <!-- 3. Datos personales -->
    <section class="card">
      <h2>3. Datos personales</h2>
      <form id="form-datos-personales">
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required />
        </div>

        <div class="campo">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" name="apellido" required />
        </div>

        <div class="acciones">
          <button type="submit" id="btn-modificar-datos">Modificar datos</button>
        </div>
      </form>
    </section>
  </main>

  <script src="../javascript/alumno.js"></script>
</body>
</html>
